name: Build Daily Clock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Daily-Clock-Android-Source.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unpack Daily Clock source ZIP
        run: |
          test -f Daily-Clock-Android-Source.zip
          mkdir -p unpacked
          unzip -q Daily-Clock-Android-Source.zip -d unpacked
          PROJECT_DIR="$(find unpacked -name package.json -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find package.json in uploaded source ZIP" >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: cd "$PROJECT_DIR" && npm install

      - name: Apply CI-only Vue template compatibility fix to extracted copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("unpacked/src/App.vue")
          source = app.read_text(encoding="utf-8")
          old = '@click="tab=\'stats\';setTimeout(drawChart,80)"'
          new = '@click="tab=\'stats\'"'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one stats-tab template handler, found {count}; refusing to modify source copy.")
          app.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Applied the CI-only template fix to the extracted copy; original ZIP and repository source remain unchanged.")
          PY

      - name: Create explicit Vue Vite config for CI
        run: |
          cat > "$PROJECT_DIR/vite.ci.config.mjs" <<'EOF'
          import { defineConfig } from 'vite'
          import vue from '@vitejs/plugin-vue'

          export default defineConfig({
            plugins: [vue()],
            base: './'
          })
          EOF

      - name: Build web app
        run: cd "$PROJECT_DIR" && npx vue-tsc -b && npx vite build --config ./vite.ci.config.mjs

      - name: Create Android project
        run: cd "$PROJECT_DIR" && npx cap add android

      - name: Sync Capacitor Android
        run: cd "$PROJECT_DIR" && npx cap sync android

      - name: Build debug APK
        run: cd "$PROJECT_DIR/android" && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Clock-debug-apk
          path: unpacked/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
